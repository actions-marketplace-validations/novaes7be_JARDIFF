<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jardiff — relatório</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--text:#1c2128;--muted:#6b7480;--border:#dfe3e8;--accent:#0969da;
  --added:#1a7f37;--added-bg:#dafbe1;--removed:#cf222e;--removed-bg:#ffebe9;
  --changed:#9a6700;--changed-bg:#fff8c5;--cosmetic:#6e7781;--cosmetic-bg:#eef0f2;
  --risk-alto:#cf222e;--risk-medio:#bf8700;--risk-nenhum:#1a7f37;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--heat-l:68%;
}
[data-theme=dark]{
  --bg:#0d1117;--surface:#161b22;--text:#e6edf3;--muted:#8b949e;--border:#30363d;--accent:#58a6ff;
  --added:#3fb950;--added-bg:#12261e;--removed:#f85149;--removed-bg:#2d1315;
  --changed:#d29922;--changed-bg:#2b2111;--cosmetic:#8b949e;--cosmetic-bg:#21262d;
  --risk-alto:#f85149;--risk-medio:#d29922;--risk-nenhum:#3fb950;--heat-l:32%;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5);border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .jars{font-family:var(--mono);color:var(--muted);flex:1}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s2) var(--s3);cursor:pointer}
.btn:hover{border-color:var(--accent)}
main{padding:var(--s5);max-width:1500px;margin:0 auto;display:grid;gap:var(--s5)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 var(--s2)}
.grid{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c,var(--border));border-radius:var(--radius);padding:var(--s3) var(--s4);text-align:left;cursor:default}
button.card{cursor:pointer}button.card:hover,.card.on{border-color:var(--c,var(--accent));box-shadow:0 0 0 1px var(--c,var(--accent))}
.card b{display:block;font-size:26px;line-height:1.1;color:var(--c,var(--text))}
.card span{color:var(--muted);font-size:12px}
.heat{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.tile{border:1px solid var(--border);border-radius:var(--radius);padding:var(--s2) var(--s3);text-align:left;cursor:pointer;background:var(--bg-t,var(--surface));min-height:54px}
.tile small{display:block;color:var(--muted);font-family:var(--mono)}
.tile:hover,.tile.sel{border-color:var(--accent)}
.toolbar{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s2) var(--s3)}
.toolbar input{flex:1;min-width:200px}
.count{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:var(--s5);align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s3)}
.tree details{margin-left:var(--s3)}.tree>details,.tree>.leafs{margin-left:0}
.tree summary{cursor:pointer;font-family:var(--mono);padding:var(--s1) 0;color:var(--muted)}
.node{display:flex;align-items:center;gap:var(--s2);width:100%;background:none;border:0;border-radius:6px;padding:var(--s1) var(--s2);cursor:pointer;text-align:left;font-family:var(--mono)}
.node:hover{background:var(--cosmetic-bg)}.node.sel{background:var(--cosmetic-bg);box-shadow:inset 3px 0 var(--accent)}
.node .n{margin-left:auto;color:var(--muted);font-size:12px}
.ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-weight:700;font-size:12px;flex:none}
.ico.added{color:var(--added);background:var(--added-bg)}.ico.removed{color:var(--removed);background:var(--removed-bg)}
.ico.changed{color:var(--changed);background:var(--changed-bg)}.ico.cosmetic{color:var(--cosmetic);background:var(--cosmetic-bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;background:var(--cosmetic-bg);color:var(--text);border:1px solid var(--border)}
.badge.k-LOGIC,.badge.k-CONDITION{background:var(--changed-bg);color:var(--changed)}
.badge.k-CALL{background:var(--added-bg);color:var(--added)}
.badge.k-METHOD_ADDED{background:var(--added-bg);color:var(--added)}.badge.k-METHOD_REMOVED{background:var(--removed-bg);color:var(--removed)}
.badge.r-alto{background:var(--removed-bg);color:var(--risk-alto)}.badge.r-medio{background:var(--changed-bg);color:var(--risk-medio)}
.member{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:var(--s4);overflow:hidden}
.member>header{padding:var(--s3);gap:var(--s2);border:0;border-bottom:1px solid var(--border);background:var(--bg)}
.member>header code{font-weight:600;margin-right:auto;word-break:break-all}
.wrap{overflow-x:auto}
table.diff{border-collapse:collapse;width:100%;font:12px/1.55 var(--mono)}
.diff td{padding:0 var(--s2);vertical-align:top}
.diff td.ln{width:40px;text-align:right;color:var(--muted);user-select:none;border-right:1px solid var(--border)}
.diff td.code{white-space:pre;width:50%}
.diff td.del{background:var(--removed-bg)}.diff td.add{background:var(--added-bg)}.diff td.empty{background:var(--cosmetic-bg)}
.muted{color:var(--muted)}
footer{padding:var(--s5);text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>jardiff</h1>
  <div class="jars" id="jars"></div>
  <button class="btn" id="theme" aria-label="Alternar modo escuro" title="Modo escuro">☾</button>
</header>
<main>
  <section><h2>Classes</h2><div class="grid" id="s-classes"></div></section>
  <section><h2>Tipos de mudança <span class="muted">(clique para filtrar)</span></h2><div class="grid" id="s-kinds"></div></section>
  <section><h2>Risco novo na v2 <span class="muted">(clique para filtrar)</span></h2><div class="grid" id="s-risk"></div></section>
  <section><h2>Mapa de calor — classes mais alteradas</h2><div class="heat" id="heat"></div></section>
  <section>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Buscar classe ou método…" aria-label="Buscar classe ou método">
      <select id="f-risk" aria-label="Filtrar por risco"><option value="">Risco: todos</option><option value="alto">Alto</option><option value="medio">Médio</option><option value="nenhum">Nenhum</option></select>
      <select id="f-kind" aria-label="Filtrar por tipo"></select>
      <button class="btn" id="clear">Limpar</button>
      <span class="count" id="count"></span>
    </div>
  </section>
  <section class="cols">
    <div class="panel tree" id="tree" aria-label="Árvore de pacotes e classes"></div>
    <div id="detail"></div>
  </section>
</main>
<footer id="foot"></footer>

  const ms = members(c);
  const body = c.status === 'COSMETIC'
    ? h('div', {class: 'panel muted'}, 'O arquivo .class mudou (hash diferente), mas o bytecode normalizado é idêntico: só nomes de variáveis locais, números de linha ou ordem do constant pool. Ignorada.')
    : ms.map(m => h('div', {class: 'member'},
        h('header', null, h('code', null, m.name),
          m.kinds.map(k => h('span', {class: 'badge k-' + k}, KL[k])),
          m.risks.map(r => h('span', {class: 'badge r-' + (['REDE', 'EXEC', 'SERIALIZACAO'].includes(r) ? 'alto' : 'medio')}, 'risco: ' + RL[r]))),
        sideBySide(m.diff)));
  const cos = c.status !== 'COSMETIC' && c.cosmetic.length
    ? h('div', {class: 'panel muted'}, h('span', {class: 'ico cosmetic'}, '≈'), ' Cosmética ignorada (variável local renomeada, sem efeito no bytecode): ', c.cosmetic.map(n => h('code', null, n + ' ')))
    : null;
  box.replaceChildren(head, body, cos);
}

/* ---------- render ---------- */
function render() {
  summary();
  const list = D.classes.filter(visible);
  if (!list.some(c => c.name === sel)) sel = list.length ? list[0].name : null;
  heat(list); tree(list); detail(list.find(c => c.name === sel));
  $('#count').textContent = `mostrando ${list.length} de ${D.classes.length} classes`;
}
function sync() { $('#q').value = f.q; $('#f-risk').value = f.risk; $('#f-kind').value = f.kind; }

/* ---------- init ---------- */
$('#jars').textContent = D.left + '  →  ' + D.right;
$('#foot').textContent = 'gerado por jardiff em ' + D.generated;
$('#f-kind').replaceChildren(h('option', {value: ''}, 'Tipo: todos'), ...Object.keys(KL).map(k => h('option', {value: k}, KL[k])));
$('#q').addEventListener('input', e => { f.q = e.target.value; render(); });
$('#f-risk').addEventListener('change', e => { f.risk = e.target.value; render(); });
$('#f-kind').addEventListener('change', e => { f.kind = e.target.value; render(); });
$('#clear').addEventListener('click', () => { f.risk = f.kind = f.q = ''; sync(); render(); });
function theme(t) { document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? '☀' : '☾'; try { localStorage.setItem('jardiff-theme', t); } catch (e) {} }
let saved = null; try { saved = localStorage.getItem('jardiff-theme'); } catch (e) {}
theme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').addEventListener('click', () => { theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); render(); });
render();
</script>
</body>
</html>
